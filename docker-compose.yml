version: '3.8'

services:
  # Flask API
  api:
    build: ./be
    container_name: divergentia-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - ./be/uploads:/app/uploads
      - ./be/outputs:/app/outputs
      - ./be/logs:/app/logs
    depends_on:
      - ollama
    networks:
      - divergentia-network
    restart: unless-stopped

  # Front-end (Vite build served by Nginx, proxying /api -> api service)
  web:
    build: ./fe
    container_name: divergentia-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - divergentia-network
    restart: unless-stopped

  # Ollama Service
  ollama:
    image: docker.io/ollama/ollama:0.32.2
    container_name: divergentia-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - divergentia-network
    restart: unless-stopped

volumes:
  ollama-data:

networks:
  divergentia-network:
    driver: bridge
