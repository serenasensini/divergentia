name: Docker Scout - Analisi Immagini

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  # Esecuzione manuale: builda e scansiona le immagini backend/frontend anche
  # fuori da una pull request (nessun commento verrà pubblicato, dato che non
  # esiste una PR associata).
  workflow_dispatch: {}

jobs:
  build-and-scan:
    name: Build & Scan (${{ matrix.component.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: ./be
            dockerfile: ./be/Dockerfile
            image: divergentia-be:${{ github.run_id }}
          - name: frontend
            context: ./fe
            dockerfile: ./fe/Dockerfile
            image: divergentia-fe:${{ github.run_id }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      # ─── BUILD ────────────────────────────────────────────────────────────────
      - name: Build dell'immagine Docker (${{ matrix.component.name }})
        run: |
          docker build "${{ matrix.component.context }}" \
            --file "${{ matrix.component.dockerfile }}" \
            --tag "${{ matrix.component.image }}"

      # ─── SCOUT — solo su PR o esecuzione manuale ─────────────────────────────
      # Usa l'action ufficiale Docker Scout invece della CLI installata a mano:
      # gestisce da sola autenticazione, commento sulla PR con formattazione
      # corretta e job summary (evita i bug di rendering Markdown incontrati
      # parsando a mano il SARIF).
      # https://github.com/docker/scout-action
      #
      # NB: `only-severities` filtra l'INTERO comando `docker scout cves`, non
      # solo cosa viene mostrato: se lo si passasse a un'unica invocazione, il
      # SARIF/commento conterrebbe solo CRITICAL/HIGH e le vulnerabilità
      # MEDIUM/LOW risulterebbero (erroneamente) "assenti" invece che presenti
      # ma non bloccanti. Per questo lo scan è diviso in due passaggi:
      # 1) report completo (tutte le severità) per visibilità/commento/SARIF;
      # 2) verifica separata, filtrata su CRITICAL/HIGH, che decide solo se
      #    bloccare la pipeline (senza scrivere un secondo commento).
      - name: Docker Scout - Report completo vulnerabilità (${{ matrix.component.name }})
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ matrix.component.image }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          ignore-base: true
          sarif-file: scan-results-${{ matrix.component.name }}.sarif.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: true
          summary: true

      - name: Carica il report SARIF completo come artifact (${{ matrix.component.name }})
        if: >
          always() &&
          (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ matrix.component.name }}-${{ github.run_id }}
          path: scan-results-${{ matrix.component.name }}.sarif.json
          retention-days: 14
          if-no-files-found: warn

      - name: Docker Scout - Blocca solo su CRITICAL/HIGH (${{ matrix.component.name }})
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ matrix.component.image }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          ignore-base: true
          only-severities: critical,high
          exit-code: true
          write-comment: false
          summary: false


      # ─── PUSH — solo su merge in main ─────────────────────────────────────────
      # Push disabilitato per il momento: nessun registry di destinazione configurato.
      # - name: Tag e push dell'immagine (post-merge)
      #   if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      #   run: |
      #     # Sostituisci REGISTRY_URL con il tuo registry (es. ghcr.io/tuonome, 123456.dkr.ecr.eu-west-1.amazonaws.com, ecc.)
      #     echo "Pronto per il push verso ${{ secrets.REGISTRY_URL }}"
      #     docker tag "${{ matrix.component.image }}" "${{ secrets.REGISTRY_URL }}/divergentia-${{ matrix.component.name }}:latest"
      #     docker push "${{ secrets.REGISTRY_URL }}/divergentia-${{ matrix.component.name }}:latest"
