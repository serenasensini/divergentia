name: Docker Scout - Analisi Immagini

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  # Esecuzione manuale: builda e scansiona le immagini backend/frontend anche
  # fuori da una pull request (nessun commento verrà pubblicato, dato che non
  # esiste una PR associata).
  workflow_dispatch: {}

jobs:
  build-and-scan:
    name: Build & Scan (${{ matrix.component.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: ./be
            dockerfile: ./be/Dockerfile
            image: divergentia-be:${{ github.run_id }}
          - name: frontend
            context: ./fe
            dockerfile: ./fe/Dockerfile
            image: divergentia-fe:${{ github.run_id }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      # ─── BUILD ────────────────────────────────────────────────────────────────
      - name: Build dell'immagine Docker (${{ matrix.component.name }})
        run: |
          docker build "${{ matrix.component.context }}" \
            --file "${{ matrix.component.dockerfile }}" \
            --tag "${{ matrix.component.image }}"

      # ─── SCOUT — solo su PR ──────────────────────────────────────────────────
      - name: Installazione Docker Scout CLI
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh \
            -o install-scout.sh
          sh install-scout.sh

      - name: Autenticazione Docker Scout
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin

      - name: Scansione vulnerabilità con Docker Scout (${{ matrix.component.name }})
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          docker scout cves "${{ matrix.component.image }}" \
            --ignore-base \
            --format sarif \
            --output scan-results-${{ matrix.component.name }}.sarif.json

      - name: Carica il report SARIF completo come artifact (${{ matrix.component.name }})
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ matrix.component.name }}-${{ github.run_id }}
          path: scan-results-${{ matrix.component.name }}.sarif.json
          retention-days: 14

      # ─── ANALISI RISULTATI ────────────────────────────────────────────────────
      - name: Verifica vulnerabilità (${{ matrix.component.name }})
        id: check_vulnerabilities
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          VULN_COUNT=$(jq '.runs[0].results | length' scan-results-${{ matrix.component.name }}.sarif.json)
          echo "Vulnerabilità trovate (${{ matrix.component.name }}): $VULN_COUNT"
          echo "vuln_count=$VULN_COUNT" >> "$GITHUB_OUTPUT"

          if [[ "$VULN_COUNT" -gt 0 ]]; then
            echo "fail_workflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "fail_workflow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commenta sulla PR con le vulnerabilità (${{ matrix.component.name }})
        if: >
          github.event_name == 'pull_request' &&
          steps.check_vulnerabilities.outputs.fail_workflow == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const component = '${{ matrix.component.name }}';
            const image = '${{ matrix.component.image }}';
            const sarif = JSON.parse(fs.readFileSync(`scan-results-${component}.sarif.json`, 'utf8'));
            const results = sarif.runs[0].results;

            // Docker Scout's SARIF `message.text` is a multi-line key/value
            // blob (Vulnerability/Severity/Package/...), not a single
            // sentence: dumping it as-is into a table cell breaks the
            // Markdown table (each embedded newline starts a "new row").
            // Extract the fields we care about and render one clean row per
            // finding instead.
            const field = (text, label) => {
              const m = text.match(new RegExp(`${label}\\s*:\\s*(.+)`));
              return m ? m[1].trim() : '';
            };
            // Belt-and-braces: collapse any stray newline and escape pipes so
            // a single malformed entry can never break the table layout.
            const sanitize = (s) => String(s || '').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|').trim();

            // Higher-severity findings must never be silently truncated out of
            // the table: sort by severity (most critical first) before capping.
            const SEVERITY_RANK = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3, UNSPECIFIED: 4, UNKNOWN: 5, NONE: 6 };
            const severityOf = (r) => {
              const text = r.message?.text || '';
              return sanitize(field(text, 'Severity') || r.level || 'unknown').toUpperCase();
            };
            const rankOf = (sev) => SEVERITY_RANK[sev] ?? 99;

            const sortedResults = [...results].sort((a, b) => rankOf(severityOf(a)) - rankOf(severityOf(b)));

            const MAX_ROWS = 50;
            const shown = sortedResults.slice(0, MAX_ROWS);

            const severityCounts = {};
            for (const r of results) {
              const sev = severityOf(r);
              severityCounts[sev] = (severityCounts[sev] || 0) + 1;
            }
            const summaryLine = Object.entries(severityCounts)
              .sort((a, b) => rankOf(a[0]) - rankOf(b[0]))
              .map(([sev, count]) => `**${sev}**: ${count}`)
              .join(' · ');

            const rows = shown.map(r => {
              const text = r.message?.text || '';
              const cve = sanitize(field(text, 'Vulnerability') || r.ruleId || 'N/A');
              const severity = sanitize(field(text, 'Severity') || r.level || 'unknown');
              const pkg = sanitize(field(text, 'Package') || 'N/A');
              const fixed = sanitize(field(text, 'Fixed version') || 'N/A');
              return `| \`${cve}\` | ${severity} | \`${pkg}\` | ${fixed} |`;
            });

            const truncatedNote = results.length > MAX_ROWS
              ? ` Mostrate le ${MAX_ROWS} vulnerabilità più severe su ${results.length} totali (ordinate per severità): esegui \`docker scout cves ${image}\` localmente per l'elenco completo.`
              : '';

            const body = [
              `## ⚠️ Vulnerabilità trovate nell'immagine Docker (${component})`,
              ``,
              `Docker Scout ha rilevato **${results.length} vulnerabilità** nell'immagine \`${image}\`.`,
              ``,
              summaryLine,
              ``,
              `| CVE | Severità | Pacchetto | Versione corretta |`,
              `|---|---|---|---|`,
              ...rows,
              ``,
              `> Le vulnerabilità elencate escludono quelle già presenti nell'immagine base (\`--ignore-base\`).${truncatedNote}`,
              `> Risolvi i problemi e ri-pusha per aggiornare questa analisi.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Blocca il workflow se ci sono vulnerabilità (${{ matrix.component.name }})
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
          steps.check_vulnerabilities.outputs.fail_workflow == 'true'
        run: |
          echo "::error::Trovate ${{ steps.check_vulnerabilities.outputs.vuln_count }} vulnerabilità nell'immagine ${{ matrix.component.name }}. Il merge è bloccato."
          exit 1

      # ─── PUSH — solo su merge in main ─────────────────────────────────────────
      # Push disabilitato per il momento: nessun registry di destinazione configurato.
      # - name: Tag e push dell'immagine (post-merge)
      #   if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      #   run: |
      #     # Sostituisci REGISTRY_URL con il tuo registry (es. ghcr.io/tuonome, 123456.dkr.ecr.eu-west-1.amazonaws.com, ecc.)
      #     echo "Pronto per il push verso ${{ secrets.REGISTRY_URL }}"
      #     docker tag "${{ matrix.component.image }}" "${{ secrets.REGISTRY_URL }}/divergentia-${{ matrix.component.name }}:latest"
      #     docker push "${{ secrets.REGISTRY_URL }}/divergentia-${{ matrix.component.name }}:latest"
