server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large document uploads through the proxy.
    client_max_body_size 25m;

    # Always serve the (self-destroying) service worker fresh so browsers holding
    # a stale worker from a previous deployment pick up the kill-switch and stop
    # intercepting API uploads. Never fall back to index.html here.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the Flask service so the browser stays
    # same-origin (no CORS needed). "api" is the compose service name.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
